name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    # Intentionally tracks GitHub's Xcode 27 preview image so release builds
    # match the toolchain used to develop and visually verify the app.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release tag
        shell: zsh {0}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 64
          fi

      - name: Report release toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Run tests
        run: swift test

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        shell: zsh {0}
        run: |
          set -euo pipefail

          if [[ -z "$DEVELOPER_ID_APPLICATION_P12_BASE64" || \
                -z "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" || \
                -z "$APP_STORE_CONNECT_API_KEY_P8_BASE64" || \
                -z "$APP_STORE_CONNECT_API_KEY_ID" || \
                -z "$APP_STORE_CONNECT_API_ISSUER_ID" ]]; then
            echo "Missing one or more release-signing secrets. See README.md#configure-release-signing." >&2
            exit 78
          fi

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          api_key_path="$RUNNER_TEMP/app-store-connect-api-key.p8"
          keychain_path="$RUNNER_TEMP/agent-browser-companion-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"

          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity_count="$(security find-identity -v -p codesigning "$keychain_path" | grep -c 'Developer ID Application' || true)"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F\" '/Developer ID Application/ { print $2; exit }')"
          if [[ "$identity_count" -ne 1 || -z "$identity" ]]; then
            echo "Expected exactly one Developer ID Application identity in the signing certificate." >&2
            exit 78
          fi

          {
            echo "CODE_SIGN_IDENTITY=$identity"
            echo "CODE_SIGN_KEYCHAIN=$keychain_path"
            echo "NOTARYTOOL_API_KEY_PATH=$api_key_path"
            echo "NOTARYTOOL_API_KEY_ID=$APP_STORE_CONNECT_API_KEY_ID"
            echo "NOTARYTOOL_API_ISSUER_ID=$APP_STORE_CONNECT_API_ISSUER_ID"
            echo "RELEASE_CERTIFICATE_PATH=$certificate_path"
            echo "RELEASE_API_KEY_PATH=$api_key_path"
            echo "RELEASE_KEYCHAIN_PATH=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Build release archive
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
          NOTARIZE: "true"
        run: ./Scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="dist/Agent-Browser-Companion-${version}.zip"
          checksum="${archive}.sha256"
          gh release create "$RELEASE_TAG" \
            "$archive#Agent Browser Companion ${version}" \
            "$checksum#SHA-256 checksum" \
            --verify-tag \
            --title "Agent Browser Companion ${version}" \
            --generate-notes

      - name: Remove signing credentials
        if: always()
        shell: zsh {0}
        run: |
          set -euo pipefail
          keychain_path="${RELEASE_KEYCHAIN_PATH:-$RUNNER_TEMP/agent-browser-companion-signing.keychain-db}"
          certificate_path="${RELEASE_CERTIFICATE_PATH:-$RUNNER_TEMP/developer-id-application.p12}"
          api_key_path="${RELEASE_API_KEY_PATH:-$RUNNER_TEMP/app-store-connect-api-key.p8}"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path" || true
          fi
          rm -f "$certificate_path" "$api_key_path"
